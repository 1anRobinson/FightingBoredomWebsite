<!DOCTYPE html>
<html lang=en-us>
    <head>
        <link rel="stylesheet" href="mapStyle.css"/>
    </head>

    <body>
            <div id="main">
                <button id="reset">Reset</button>
                <div id="map">
                    <div class="subLayer" id="kingdoms">
                        <button class="expander" id="PL" onclick="reveal('','')">Plants (Plantae)</button>
                        <button class="expander" id="AK" onclick="reveal('AK','Bones')">Animals (Animalia)</button>
                        <button class="expander" id="FG" onclick="reveal('','')">Fungi</button>
                        <button class="expander" id="PR" onclick="reveal('','')">Protists (Protista)</button>
                        <button class="expander" id="AR" onclick="reveal('','')">Archaea</button>
                        <button class="expander" id="BA" onclick="reveal('','')">Bacteria (Animalia)</button>  
                    </div>   
                    <div class="subLayer" id="Bones">
                        <button class="expander" id="noBones" onclick="reveal('')">Invertebrates</button>                  
                        <button class="expander" id="yesBones" onclick="reveal('yesBones','Blood')">Vertebrates (Chordata)</button> 
                        <div class="subLayer" id="Blood">
                            <button class="expander" id="Cold" onclick="reveal('Cold','coldGroup')">Cold Blooded</button>                  
                            <button class="expander" id="Warm" onclick="reveal('Warm','warmGroup')">Warm Blooded</button> 
                            <div class="subLayer" id="coldGroup">
                                <button class="expander" id="fish">Fish</button>
                                <button class="expander" id="reptiles">Reptiles (Reptilia)</button>
                                <button class="expander" id="amphibians">Amphibians (Amphibia)</button>
                            </div>    

                            <div class="subLayer" id="warmGroup">
                                <button class="expander" id="birds">Birds (Aves)</button>
                                <button class="expander" id="mammalia">Mammals (Mammalia)</button>
                            </div>
                        </div>
                    </div>            
                </div>
                <img id="template" src="template.svg">
            </div>
            <script src="panzoom.min.js"></script>
            <script src="nav.js"></script>
    </body>
</html>
